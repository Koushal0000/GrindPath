<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background subtle deep navy gradient -->
    <linearGradient id="gp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b18" />
    </linearGradient>

    <!-- Brand gradient: Blue -> Indigo -> Purple -->
    <linearGradient id="gp-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Upward Arrow / Progress highlight gradient -->
    <linearGradient id="gp-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle container border stroke -->
    <linearGradient id="gp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Deep Navy / SaaS Background -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#gp-bg)" stroke="url(#gp-border)" stroke-width="1.2" />

  <!-- The "G" + Upward Progress Path Mark -->
  <!-- Outer C-loop of 'G' -->
  <path
    d="M 23 10.5 C 21.2 7.8 18.2 6.5 14.5 6.5 C 9.5 6.5 6 10.5 6 16 C 6 21.5 9.5 25.5 14.8 25.5 C 19.8 25.5 23.2 22.2 23.8 17.5 L 15.5 17.5"
    fill="none"
    stroke="url(#gp-grad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ascending growth indicator: dynamic upward-right path accent -->
  <path
    d="M 19 12.5 L 24.5 7 L 24.5 11"
    fill="none"
    stroke="url(#gp-arrow)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 20.5 7 L 24.5 7"
    fill="none"
    stroke="url(#gp-arrow)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>